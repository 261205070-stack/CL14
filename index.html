<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>はじめてのページ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div style="position: relative; width: 480px; height: 374px;">

  <img id="back" src="./bg0.png" alt="はなばたけ">
  <img id="back1" src="./bg1.png" alt="はなばたけ">
 <div class="chou">
  <img id="b1" class="butterfly" src="./butterfly.gif" alt="ちょう">
  <img id="b2" class="butterfly" src="./butterfly.gif" alt="ちょう">
  <img id="b3" class="butterfly" src="./butterfly.gif" alt="ちょう">
 </div>
 <div style="position: absolute; left: 20px; top: 20px; background: #fef3c7; padding: 6px; z-index: 3;">ぽかぽか陽気の穏やかな朝花畑では、蝶々がのんびり飛んでいます</div>

</div>

<script>
document.querySelectorAll('.butterfly').forEach(function (el) {
  el.addEventListener('mouseover', function () {
    var randomX = Math.floor(Math.random() * (480 - 75));
    var randomY = Math.floor(Math.random() * (374 - 75));
    el.style.left = randomX + 'px';
    el.style.top = randomY + 'px';
  });
});
</script>


</body>
</html>
